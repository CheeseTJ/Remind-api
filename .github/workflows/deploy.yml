name: Deploy

# push 到 master 自动构建并部署到本机（self-hosted runner 与服务同机）：
#   docker compose build → up -d 重建容器 → 健康检查。
# 崩溃恢复由 compose 的 restart: unless-stopped 负责。
# 数据（config.yaml / remind.db）在宿主机 /opt/remind，容器重建不丢。
on:
  push:
    branches: [master]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    # 🔒 安全门禁：本 job 跑在 self-hosted runner（即生产服务器本身）。
    # 仓库一旦公开，攻击者可通过 fork + PR 让你的服务器执行其代码。
    # 这里强制只允许本仓库（owner 自己的分支）触发，外部 fork/PR 一律跳过。
    if: github.repository_owner == 'CheeseTJ'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build & Up（docker compose）
        run: |
          sudo docker compose build
          sudo docker compose up -d

      - name: 健康检查
        run: |
          sleep 2
          curl -fsS http://127.0.0.1:8085/healthz
